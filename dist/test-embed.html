<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miku Player 嵌入测试</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #141e30; color: #e8e8e8; padding: 40px; min-height: 100vh; }
  h1 { font-size: 22px; margin-bottom: 12px; }
  p { color: #9aa7bd; line-height: 1.8; }
  .demo-box { margin-top: 24px; padding: 16px; background: rgba(255,255,255,.05); border-radius: 10px; }
  .demo-box button { margin-right: 8px; padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; background: #5a9cff; color: #fff; }
  code { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>🎵 Miku Vinyl Player — 嵌入测试页</h1>
  <p>本页面通过 <code>MikuPlayer.init()</code> 接口加载插件。右下角应出现悬浮胶片播放器。</p>
  <p>所有功能（播放/暂停、搜索、音谱调节、形象切换、唱跳）应完全可用。</p>
  <div class="demo-box">
    <button onclick="player.play()">播放</button>
    <button onclick="player.pause()">暂停</button>
    <button onclick="player.toggle()">切换</button>
    <button onclick="player.destroy()">销毁</button>
    <button onclick="player=MikuPlayer.init()">重新挂载</button>
  </div>
  <p style="margin-top:20px;">默认挂到 body；也可指定容器：<code>MikuPlayer.init('#my-container')</code></p>

  <script src="miku-player.js"></script>
  <script>
    var player = MikuPlayer.init();
  </script>
</body>
</html>
